name: Windows distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build bundled EXE
        shell: powershell
        run: ./app/Build.ps1
      - name: Validate routing and clean distribution
        shell: powershell
        run: |
          python app/test_network_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python app/test_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./app/Test-Distribution.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Campus-Network-windows-x64
          path: Campus-Network.exe
